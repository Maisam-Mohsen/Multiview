<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>Multiview Player</title>
    
    <style>
        body { margin: 0; background: #000; font-family: Tahoma, sans-serif; overflow-x: hidden; }
        
        .header-text {
            color: #ffffff;
            text-align: center;
            direction: rtl;
            padding: 15px 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 10px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); max-width: 1600px; } }
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
            pointer-events: none; /* جلوگیری از کلیک مستقیم که باعث باز شدن اپ یوتیوب می‌شود */
        }

        /* استایل دکمه شروع */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }
        
        #start-btn {
            background-color: #ff0000; /* رنگ قرمز یوتیوب */
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-family: Tahoma, sans-serif;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            transition: transform 0.2s;
        }
        
        #start-btn:active { transform: scale(0.95); }
        
        .hint-text {
            color: #aaa;
            margin-top: 15px;
            font-size: 14px;
            direction: rtl;
        }
    </style>
</head>
<body>

    <!-- صفحه سیاه اولیه برای گرفتن کلیک کاربر -->
    <div id="start-overlay">
        <button id="start-btn">▶ شروع پخش ویدیوها</button>
        <div class="hint-text">برای جلوگیری از باز شدن اپ یوتیوب، اینجا کلیک کنید</div>
    </div>

    <div class="header-text">
        شبکه‌های پخش زنده
    </div>

    <div class="grid" id="video-grid">
        <div class="video-container" data-video-id="aLBmwItG1O0"></div>
        <div class="video-container" data-video-id="OI-i0uqjQi4"></div>
        <div class="video-container" data-video-id="lwOQn36TeiA"></div>
        <div class="video-container" data-video-id="A0fVc5kOmCs"></div>
        <div class="video-container" data-video-id="f11BI1x6ezg"></div>
        <div class="video-container" data-video-id="0hYlbJFgpGE"></div>
    </div>

    <script>
        var globalConfig = {
            speed: 0.25,
            loop: true,
            quality: 'small' 
        };

        var videoMuteSettings = {
            'aLBmwItG1O0': true,
            'OI-i0uqjQi4': true,
            'lwOQn36TeiA': true,
            'A0fVc5kOmCs': true,
            'f11BI1x6ezg': false, // فقط این ویدیو صدا دارد
            '0hYlbJFgpGE': true
        };

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var players = [];
        var isStarted = false;

        function onYouTubeIframeAPIReady() {
            var containers = document.querySelectorAll('.video-container');
            
            containers.forEach(function(container) {
                var videoId = container.getAttribute('data-video-id');
                var playerDiv = document.createElement('div');
                container.appendChild(playerDiv);

                var shouldMute = videoMuteSettings[videoId] !== false;

                var player = new YT.Player(playerDiv, {
                    videoId: videoId,
                    playerVars: {
                        'playsinline': 1,
                        'loop': globalConfig.loop ? 1 : 0,
                        'playlist': videoId,
                        'autoplay': 0, // فعلاً 0 است تا بعد از کلیک کاربر پخش شود
                        'mute': shouldMute ? 1 : 0,
                        'rel': 0, // جلوگیری از نمایش ویدیوهای پیشنهادی در انتها
                        'origin': 'https://maisam-mohsen.github.io' // برای امنیت بیشتر API
                    },
                    events: {
                        'onReady': function(event) {
                            var p = event.target;
                            p.setPlaybackRate(globalConfig.speed);
                            if (typeof p.setPlaybackQuality === 'function') {
                                p.setPlaybackQuality(globalConfig.quality);
                            }
                            
                            if (shouldMute) {
                                p.mute();
                            } else {
                                p.unMute(); 
                            }
                        }
                    }
                });
                players.push(player);
            });
        }

        // وقتی کاربر روی دکمه شروع کلیک کرد
        document.getElementById('start-btn').addEventListener('click', function() {
            if (isStarted) return;
            isStarted = true;

            // مخفی کردن صفحه سیاه
            document.getElementById('start-overlay').style.display = 'none';

            // پخش همه ویدیوها
            players.forEach(function(p) {
                if (p && p.playVideo) {
                    p.playVideo();
                }
            });

            // فعال کردن کلیک روی ویدیوها بعد از شروع (در صورت نیاز)
            var iframes = document.querySelectorAll('.video-container iframe');
            iframes.forEach(function(iframe) {
                iframe.style.pointerEvents = 'auto';
            });
        });

        // کدهای مربوط به پس‌زمینه
        document.addEventListener('visibilitychange', function() {
            if (isStarted) {
                players.forEach(function(p) {
                    if (p && p.playVideo) p.playVideo();
                });
            }
        });
    </script>
</body>
</html>
