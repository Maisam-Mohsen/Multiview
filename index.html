<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=1.0">
    <title>پخش‌کننده چندتایی یوتیوب - حالت دسکتاپ</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 20px;
            min-width: 1200px;
        }
        h1 { text-align: center; color: #ffbb00; }
        .controls-bar {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-unmute {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,0,0,0.4);
        }
        .btn-unmute:hover {
            background-color: #cc0000;
        }
        .notice {
            text-align: center;
            color: #ffcc00;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            max-width: 1400px;
            margin: 0 auto;
        }
        .video-container { 
            background: #1e1e1e; 
            padding: 10px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        .video-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
        }
        .video-wrapper iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>

    <h1>پخش‌کننده چندتایی یوتیوب (Desktop Mode, Loop, Speed 0.25, Low Quality)</h1>
    
    <div class="notice">
        ⚠️ به دلیل قوانین مرورگرها برای جلوگیری از سر و صدا، لطفاً ابتدا روی دکمه زیر کلیک کنید تا صدا و تنظیمات روی همه ویدیوها اعمال شود:
    </div>

    <div class="controls-bar">
        <button class="btn-unmute" onclick="startAllWithSound()">▶️ کلیک کنید تا همه ویدیوها با صدا و سرعت 0.25 پخش شوند</button>
    </div>

    <div class="grid">
        <div class="video-container">
            <div class="video-wrapper"><div id="player-0"></div></div>
        </div>
        <div class="video-container">
            <div class="video-wrapper"><div id="player-1"></div></div>
        </div>
        <div class="video-container">
            <div class="video-wrapper"><div id="player-2"></div></div>
        </div>
        <div class="video-container">
            <div class="video-wrapper"><div id="player-3"></div></div>
        </div>
        <div class="video-container">
            <div class="video-wrapper"><div id="player-4"></div></div>
        </div>
        <div class="video-container">
            <div class="video-wrapper"><div id="player-5"></div></div>
        </div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // شناسه‌های ویدیو استخراج شده از فایل شما[span_0](start_span)[span_0](end_span)
        var videoIds = [
            'aLBmwItG1O0',[span_1](start_span)[span_1](end_span)
            'OI-i0uqjQi4',[span_2](start_span)[span_2](end_span)
            'lwOQn36TeiA',[span_3](start_span)[span_3](end_span)
            'A0fVc5kOmCs',[span_4](start_span)[span_4](end_span)
            'f11BI1x6ezg',[span_5](start_span)[span_5](end_span)
            '0hYlbJFgpGE[span_6](start_span)'[span_6](end_span)
        ];

        var players = [];

        function onYouTubeIframeAPIReady() {
            for (var i = 0; i < videoIds.length; i++) {
                (function(index) {
                    players[index] = new YT.Player('player-' + index, {
                        videoId: videoIds[index],
                        playerVars: {
                            'autoplay': 1,
                            'loop': 1,
                            'playlist': videoIds[index],
                            'controls': 1,
                            'rel': 0,
                            'playsinline': 0,
                            'mute': 1 // ابتدا ویدیوها بی‌صدا لود می‌شوند تا مرورگر بلاک نکند
                        },
                        events: {
                            'onReady': function(event) {
                                event.target.setPlaybackRate(0.25);
                                event.target.setPlaybackQuality('small');
                                event.target.playVideo();
                            }
                        }
                    });
                })(i);
            }
        }

        // تابع اجرایی با دکمه برای دور زدن محدودیت مرورگر و Unmute کامل همه ویدیوها
        function startAllWithSound() {
            for (var i = 0; i < players.length; i++) {
                if (players[i] && players[i].unMute) {
                    players[i].unMute();
                    players[i].setVolume(100);
                    players[i].setPlaybackRate(0.25);
                    players[i].setPlaybackQuality('small');
                    players[i].playVideo();
                }
            }
        }
    </script>
</body>
</html>
