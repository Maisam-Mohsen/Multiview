<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>YouTube Multiview - Automatic</title>
    <style>
        body { 
            background: #0f0f0f; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            min-width: 1200px;
            font-family: Tahoma, sans-serif;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        .video-box { 
            background: #1a1a1a; 
            padding: 10px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        .video-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 6px; 
        }
        .video-wrapper iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <div class="grid">
        <div class="video-box"><div class="video-wrapper"><div id="player-0"></div></div></div>
        <div class="video-box"><div class="video-wrapper"><div id="player-1"></div></div></div>
        <div class="video-box"><div class="video-wrapper"><div id="player-2"></div></div></div>
        <div class="video-box"><div class="video-wrapper"><div id="player-3"></div></div></div>
        <div class="video-box"><div class="video-wrapper"><div id="player-4"></div></div></div>
        <div class="video-box"><div class="video-wrapper"><div id="player-5"></div></div></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // شناسه‌های ویدیو استخراج شده از فایل شما[span_1](start_span)[span_1](end_span)
        var videoIds = [
            'aLBmwItG1O0', //[span_2](start_span)[span_2](end_span)
            'OI-i0uqjQi4', //[span_3](start_span)[span_3](end_span)
            'lwOQn36TeiA', //[span_4](start_span)[span_4](end_span)
            'A0fVc5kOmCs', //[span_5](start_span)[span_5](end_span)
            'f11BI1x6ezg', //[span_6](start_span)[span_6](end_span)
            '0hYlbJFgpGE'  //[span_7](start_span)[span_7](end_span)
        ];

        var players = [];

        function onYouTubeIframeAPIReady() {
            for (var i = 0; i < videoIds.length; i++) {
                (function(index) {
                    players[index] = new YT.Player('player-' + index, {
                        videoId: videoIds[index],
                        playerVars: {
                            'autoplay': 1,
                            'loop': 1,
                            'playlist': videoIds[index],
                            'controls': 1,
                            'rel': 0,
                            'playsinline': 0,
                            'mute': 0 // تلاش برای پخش صدادار به صورت خودکار
                        },
                        events: {
                            'onReady': function(event) {
                                event.target.setPlaybackRate(0.25);
                                event.target.setPlaybackQuality('small');
                                event.target.unMute();
                                event.target.setVolume(100);
                                event.target.playVideo();
                            }
                        }
                    });
                })(i);
            }
        }
    </script>
</body>
</html>
