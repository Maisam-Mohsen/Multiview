<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #000; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 8px;
    }
    iframe {
      aspect-ratio: 16 / 9;
      width: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="grid">
    <iframe src="https://www.youtube.com/embed/aLBmwItG1O0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/OI-i0uqjQi4" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/lwOQn36TeiA" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/A0fVc5kOmCs" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/f11BI1x6ezg" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/0hYlbJFgpGE" allowfullscreen></iframe>
  </div>
</body>
</html>
