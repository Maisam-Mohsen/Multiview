<script>
const videoIds = [
    "aLBmwItG1O0",
    "OI-i0uqjQi4",
    "lwOQn36TeiA",
    "A0fVc5kOmCs",
    "f11BI1x6ezg",
    "0hYlbJFgpGE",
    "1kQtNpZbTO0"
];

const players = [];
let pageInBackground = false;
let soundRequested = false;
let manuallyPaused = false;

/* Load YouTube API */
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function () {
    videoIds.forEach((id, index) => {
        players[index] = new YT.Player("iframe-" + index, {
            videoId: id,

            playerVars: {
                autoplay: 1,
                controls: 1,
                playsinline: 1,
                loop: 1,
                playlist: id,
                rel: 0
            },

            events: {
                onReady: function (event) {
                    const p = event.target;

                    // Phase 1: Start muted for autoplay compatibility.
                    p.mute();
                    p.setVolume(100);
                    p.setPlaybackRate(0.25);
                    p.playVideo();

                    // Phase 2: Attempt automatic unmuting.
                    setTimeout(() => {
                        if (p.getPlayerState() === YT.PlayerState.PLAYING) {
                            p.unMute();
                            p.setVolume(100);
                        }
                    }, 2000);
                },

                onStateChange: function (event) {
                    if (event.data === YT.PlayerState.PLAYING) {
                        // Retry after playback starts.
                        if (soundRequested && !pageInBackground) {
                            event.target.unMute();
                            event.target.setVolume(100);
                        }
                    }
                }
            }
        });
    });
};

/* Manual user-gesture fallback */
function masterAction(action) {
    if (action === "play") {
        manuallyPaused = false;

        players.forEach(p => {
            if (p) p.playVideo();
        });
    }

    if (action === "pause") {
        manuallyPaused = true;

        players.forEach(p => {
            if (p) p.pauseVideo();
        });
    }

    if (action === "mute") {
        players.forEach(p => {
            if (p) p.mute();
        });
    }

    if (action === "unmute") {
        soundRequested = true;
        manuallyPaused = false;

        players.forEach(p => {
            if (!p) return;

            p.unMute();
            p.setVolume(100);
            p.playVideo();
        });
    }
}

/*
 * Background transition:
 * Attempt mute -> short delay -> unmute.
 *
 * Browser visibility events are best-effort. Android may suspend
 * JavaScript before the timer executes.
 */
function backgroundSoundCycle() {
    if (manuallyPaused || !players.length) return;

    players.forEach(p => {
        if (p) p.mute();
    });

    setTimeout(() => {
        if (manuallyPaused) return;

        players.forEach(p => {
            if (!p) return;

            p.unMute();
            p.setVolume(100);
            p.playVideo();
        });
    }, 800);
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        pageInBackground = true;

        // Attempt the requested mute-then-unmute sequence.
        backgroundSoundCycle();

    } else {
        pageInBackground = false;

        if (manuallyPaused) return;

        // Recover players when returning to the page.
        players.forEach(p => {
            if (!p) return;

            const state = p.getPlayerState();

            if (state === YT.PlayerState.PAUSED ||
                state === YT.PlayerState.ENDED) {
                p.playVideo();
            }

            if (soundRequested) {
                p.unMute();
                p.setVolume(100);
            }
        });
    }
});

/* Retry recovery while the page is active. */
setInterval(() => {
    if (document.hidden || manuallyPaused) return;

    players.forEach(p => {
        if (!p) return;

        if (p.getPlayerState() === YT.PlayerState.ENDED) {
            p.seekTo(0);
            p.playVideo();
        }
    });
}, 5000);
</script>
