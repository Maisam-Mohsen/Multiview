<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-YouTube Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        /* CRITICAL: Iframes require explicit dimensions to render and play */
        .player-container {
            width: 100%;
            max-width: 560px;
            height: 315px;
            margin: 15px auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #ff0000;
            color: #white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <h1>Multi-YouTube Player Dashboard</h1>
    
    <!-- User Gesture Control (Required by browsers to enable sound) -->
    <div class="controls">
        <button onclick="masterAction('unmute')">🔊 Enable Sound & Play All</button>
        <button onclick="masterAction('pause')">⏸ Pause All</button>
    </div>

    <!-- Required DOM Containers -->
    <div id="iframe-0" class="player-container"></div>
    <div id="iframe-1" class="player-container"></div>
    <div id="iframe-2" class="player-container"></div>
    <div id="iframe-3" class="player-container"></div>
    <div id="iframe-4" class="player-container"></div>
    <div id="iframe-5" class="player-container"></div>
    <div id="iframe-6" class="player-container"></div>

    <script>
    const videoIds = [
        "aLBmwItG1O0",
        "OI-i0uqjQi4",
        "lwOQn36TeiA",
        "A0fVc5kOmCs",
        "f11BI1x6ezg",
        "0hYlbJFgpGE",
        "1kQtNpZbTO0"
    ];

    const players = [];
    let manuallyPaused = false;
    let soundRequested = false;

    // Safely inject YouTube IFrame API script
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName("script")[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // Global callback required by YouTube API
    window.onYouTubeIframeAPIReady = function () {
        if (!window.YT || !window.YT.Player) {
            console.error("YouTube API failed to load. Check your adblocker or network.");
            return;
        }

        videoIds.forEach((id, index) => {
            players[index] = new YT.Player("iframe-" + index, {
                videoId: id,
                playerVars: {
                    autoplay: 1,
                    mute: 1,             // Mandatory for browser autoplay policies
                    controls: 1,
                    playsinline: 1,
                    loop: 1,
                    playlist: id,        // Required for single-video looping
                    rel: 0,
                    enablejsapi: 1
                },
                events: {
                    onReady: function (event) {
                        const p = event.target;
                        p.setVolume(100);

                        try {
                            p.setPlaybackRate(0.25); // Set slow motion if supported
                        } catch (e) {
                            console.warn("Playback rate adjustment skipped for video:", id);
                        }

                        if (!manuallyPaused) {
                            p.playVideo();
                        }
                    },
                    onError: function (event) {
                        console.error(`YouTube Error on player ${index} (ID: ${id}), Error Code: ${event.data}`);
                    },
                    onStateChange: function (event) {
                        if (event.data === YT.PlayerState.ENDED) {
                            event.target.seekTo(0);
                            event.target.playVideo();
                        }
                    }
                }
            });
        });
    };

    function masterAction(action) {
        if (action === "pause") {
            manuallyPaused = true;
            players.forEach(p => { if (p && typeof p.pauseVideo === "function") p.pauseVideo(); });
        } 
        else if (action === "unmute") {
            soundRequested = true;
            manuallyPaused = false;
            players.forEach(p => {
                if (p && typeof p.unMute === "function") {
                    p.unMute();
                    p.setVolume(100);
                    p.playVideo();
                }
            });
        }
    }// Attempt to unmute and play all videos after 60 seconds
setTimeout(() => {
    console.log("Attempting to unmute all YouTube videos...");

    players.forEach(player => {
        if (player && typeof player.unMute === "function") {
            try {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            } catch (error) {
                console.log("Could not unmute player:", error);
            }
        }
    });
}, 60000);
    </script>
</body>
</html>
