<script>
const videoIds = [
    "aLBmwItG1O0",
    "OI-i0uqjQi4",
    "lwOQn36TeiA",
    "A0fVc5kOmCs",
    "f11BI1x6ezg",
    "0hYlbJFgpGE",
    "1kQtNpZbTO0"
];

const players = [];
let pageInBackground = false;
let soundRequested = false;
let manuallyPaused = false;

/* Load YouTube API asynchronously */
if (!window.YT) {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function () {
    videoIds.forEach((id, index) => {
        players[index] = new YT.Player("iframe-" + index, {
            videoId: id,
            playerVars: {
                autoplay: 1,
                mute: 1,             // CRITICAL: Must be specified here for browser autoplay compliance
                controls: 1,
                playsinline: 1,
                loop: 1,
                playlist: id,        // Required for single-video looping
                rel: 0,
                enablejsapi: 1
            },
            events: {
                onReady: function (event) {
                    const p = event.target;
                    p.setVolume(100);
                    
                    // Safely set playback rate if supported by the stream
                    try {
                        p.setPlaybackRate(0.25);
                    } catch (e) {
                        console.warn("Playback rate adjustment not supported for video:", id);
                    }

                    if (!manuallyPaused) {
                        p.playVideo();
                    }
                },

                onStateChange: function (event) {
                    // Handle loop recovery if ended
                    if (event.data === YT.PlayerState.ENDED) {
                        event.target.seekTo(0);
                        event.target.playVideo();
                    }
                }
            }
        });
    });
};

/* Professional user-gesture handler */
function masterAction(action) {
    if (action === "play") {
        manuallyPaused = false;
        players.forEach(p => { if (p && typeof p.playVideo === "function") p.playVideo(); });
    }

    if (action === "pause") {
        manuallyPaused = true;
        players.forEach(p => { if (p && typeof p.pauseVideo === "function") p.pauseVideo(); });
    }

    if (action === "mute") {
        players.forEach(p => { if (p && typeof p.mute === "function") p.mute(); });
    }

    if (action === "unmute") {
        soundRequested = true;
        manuallyPaused = false;

        // Browsers permit unmuting ONLY inside an explicit user click handler
        players.forEach(p => {
            if (!p || typeof p.unMute !== "function") return;
            p.unMute();
            p.setVolume(100);
            p.playVideo();
        });
    }
}

/* Page Visibility Handling */
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        pageInBackground = true;
        // Mute or pause heavy streams in the background to save CPU/battery
        players.forEach(p => {
            if (p && typeof p.mute === "function") p.mute();
        });
    } else {
        pageInBackground = false;
        if (manuallyPaused) return;

        players.forEach(p => {
            if (!p) return;
            const state = p.getPlayerState ? p.getPlayerState() : null;
            if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED) {
                p.playVideo();
            }
            if (soundRequested && typeof p.unMute === "function") {
                p.unMute();
                p.setVolume(100);
            }
        });
    }
});

/* Periodic recovery interval */
setInterval(() => {
    if (document.hidden || manuallyPaused) return;

    players.forEach(p => {
        if (!p || typeof p.getPlayerState !== "function") return;
        if (p.getPlayerState() === YT.PlayerState.ENDED) {
            p.seekTo(0);
            p.playVideo();
        }
    });
}, 5000);
</script>
